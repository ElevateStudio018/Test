<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Illustration: gräventreprenör på arbetsplats med grävmaskin och firmabil">
  <defs>
    <linearGradient id="hpSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a3d"/>
      <stop offset="1" stop-color="#030f27"/>
    </linearGradient>
    <radialGradient id="hpGlow" cx="80%" cy="8%" r="60%">
      <stop offset="0" stop-color="#fdbe33" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fdbe33" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hpGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030f27" stop-opacity="0"/>
      <stop offset="1" stop-color="#000814" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#hpSky)"/>
  <rect width="1600" height="900" fill="url(#hpGlow)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <path d="M-100,560 C 280,520 520,600 860,560 C 1180,525 1420,600 1700,560"/>
    <path d="M-100,630 C 300,590 560,660 880,620 C 1200,585 1460,655 1700,620"/>
    <path d="M-100,700 C 320,660 600,730 900,690 C 1220,650 1480,720 1700,685"/>
  </g>
  <g fill="none" stroke="#fdbe33" stroke-opacity="0.18" stroke-width="2.5">
    <path d="M-100,760 C 340,720 620,790 920,750 C 1240,710 1500,780 1700,745"/>
  </g>

  <!-- excavator -->
  <g transform="translate(760,430) scale(3.4)" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="62" width="62" height="16" rx="8"/>
    <rect x="14" y="34" width="34" height="30" rx="6"/>
    <rect x="20" y="40" width="14" height="12" rx="3"/>
    <path d="M44 40 L74 14"/>
    <path d="M74 14 L90 42"/>
    <path d="M90 42 L80 55 L67 50 L76 36 Z"/>
  </g>

  <!-- unbranded company vehicle (logo pending) -->
  <g transform="translate(1130,560) scale(2.6)" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="26" width="50" height="34" rx="3"/>
    <path d="M56 38 H80 L92 52 V60 H56 Z"/>
    <circle cx="26" cy="66" r="10"/>
    <circle cx="76" cy="66" r="10"/>
  </g>

  <rect width="1600" height="900" fill="url(#hpGround)"/>
</svg>
